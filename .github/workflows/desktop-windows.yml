# Builds the Windows desktop app (.msi and setup .exe) on a GitHub-hosted Windows machine, so anyone on the
# team can download the installers without building them on their own PC.
# Run it from GitHub: Actions → "Desktop app (Windows)" → Run workflow. The installers are attached to the
# run as an artifact. It also runs on pull requests that change the desktop app. See src-tauri/BUILDING.md.
name: Desktop app (Windows)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src-tauri/**"
      - ".github/workflows/desktop-windows.yml"

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installers:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The window loads the deployed site (build.frontendDist), so there is no web build here.
      # Tauri downloads WiX (.msi) and NSIS (setup .exe) by itself. Not code-signed: Windows shows
      # "unknown publisher" (More info → Run anyway).
      - name: Build .msi and setup .exe
        run: npm run tauri build -- --bundles msi,nsis

      - uses: actions/upload-artifact@v4
        with:
          name: CoCommit-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
