[package]
name = "cocommit"
version = "0.1.0"
description = "CoCommit desktop app"
edition = "2021"

[lib]
name = "cocommit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
